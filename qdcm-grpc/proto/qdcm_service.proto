syntax = "proto3";

message QdcmPacket {
  int32 id = 1; // display id in request, return code in response
  uint32 size = 2;
  bytes content = 3;
}

service QdcmDisplayApi {
  rpc Dispatch(QdcmPacket) returns (QdcmPacket) {}
}